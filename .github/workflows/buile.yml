name: Build Custom AirBeep

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        run: |
          # macos-15 默认自带 Xcode 16.x，这里打印版本以确认
          xcodebuild -version

      - name: Build Dependencies
        run: |
          # 1. 安装 Rust 工具链
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          
          # 2. 安装 iOS 交叉编译所需的 Target
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          
          # 3. 执行项目自带的 Airlift 编译脚本
          if [ -f "scripts/build-airlift-xcframework.sh" ]; then
            chmod +x scripts/build-airlift-xcframework.sh
            ./scripts/build-airlift-xcframework.sh
          fi

      - name: Build and Package
        run: |
          # 编译项目并禁用签名
          xcodebuild -project AirBeep.xcodeproj \
            -scheme AirBeep \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
            
          # 打包成 IPA 格式
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r AirBeep-Custom.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirBeep-Custom-IPA
          path: AirBeep-Custom.ipa
