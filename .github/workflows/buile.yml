name: Build Custom AirBeep

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        run: |
          # 显式指定 Xcode 版本（尝试使用较新的 16.4）
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Build Dependencies
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          if [ -f "scripts/build-airlift-xcframework.sh" ]; then
            chmod +x scripts/build-airlift-xcframework.sh
            ./scripts/build-airlift-xcframework.sh
          fi

      - name: Build and Package
        run: |
          # 注入必要的环境变量（密码替换为你的实际值，如不需要可留空）
          DEVELOPMENT_TEAM="YOUR_TEAM_ID" \
          AIRLIFT_TARGET_HOST="10.7.0.1" \
          xcodebuild -project AirBeep.xcodeproj \
            -scheme AirBeep \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
            
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r AirBeep-Custom.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirBeep-Custom-IPA
          path: AirBeep-Custom.ipa
