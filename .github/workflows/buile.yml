name: Build Custom AirBeep

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # 关键：拉取项目依赖的子模块

      - name: Set up Xcode
        run: |
          # 项目可能对 Xcode 版本有要求，这里使用较新的 Xcode 15.4
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Build Dependencies
        run: |
          # 如果项目里有自定义的依赖编译脚本，在这里执行它
          if [ -f "scripts/build-airlift-xcframework.sh" ]; then
            chmod +x scripts/build-airlift-xcframework.sh
            ./scripts/build-airlift-xcframework.sh
          fi

      - name: Build and Package
        run: |
          # 编译项目并禁用签名
          xcodebuild -project AirBeep.xcodeproj \
            -scheme AirBeep \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
            
          # 打包成 IPA
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r AirBeep-Custom.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirBeep-Custom-IPA
          path: AirBeep-Custom.ipa
