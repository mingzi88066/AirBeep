name: Build Custom AirBeep

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        run: |
          # macos-15 自带 Xcode 16.x，这里切换到 16.1 或更高版本
          sudo xcode-select -s /Applications/Xcode_16.1.app
          xcodebuild -version

      - name: Build Dependencies
        run: |
          if [ -f "scripts/build-airlift-xcframework.sh" ]; then
            chmod +x scripts/build-airlift-xcframework.sh
            ./scripts/build-airlift-xcframework.sh
          fi

      - name: Build and Package
        run: |
          xcodebuild -project AirBeep.xcodeproj \
            -scheme AirBeep \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
            
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r AirBeep-Custom.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirBeep-Custom-IPA
          path: AirBeep-Custom.ipa
