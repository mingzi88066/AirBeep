name: Build AirBeep IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "airbeep/**"
      - "airbeep.xcodeproj/**"
      - "scripts/**"
      - ".github/workflows/buile.yml"

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          # 不写死版本：挑 runner 上已安装的最新 Xcode，避免指定版本不存在直接失败
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Check Localization
        run: |
          python3 scripts/check-localization.py
          python3 scripts/check-swift-strings.py

      - name: Build Dependencies
        run: |
          # 仓库已内置 Vendor/AirCard/AirliftFFI.xcframework，
          # 只有该目录缺失时才需要从源码重新编译（此时才装 Rust）
          if [ -d "Vendor/AirCard/AirliftFFI.xcframework" ]; then
            echo "使用仓库内置的 AirliftFFI.xcframework，跳过编译"
          elif [ -f "scripts/build-airlift-xcframework.sh" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
            rustup target add aarch64-apple-ios aarch64-apple-ios-sim
            chmod +x scripts/build-airlift-xcframework.sh
            ./scripts/build-airlift-xcframework.sh
          else
            echo "缺少 AirliftFFI.xcframework，且没有编译脚本" >&2
            exit 1
          fi

      - name: Build and Package
        run: |
          # 注意工程名与 scheme 都是全小写的 airbeep
          xcodebuild -project airbeep.xcodeproj \
            -scheme airbeep \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qr AirBeep-Custom.ipa Payload
          ls -lh AirBeep-Custom.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirBeep-Custom-IPA
          path: AirBeep-Custom.ipa
          if-no-files-found: error
