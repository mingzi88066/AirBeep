name: Release unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          # 默认 GitHub 的 macos-14 已经是 Xcode 15，这里尝试指定 16
          sudo xcode-select -s /Applications/Xcode_16.0.app
          xcodebuild -version

      - name: Build and Package
        run: |
          # 编译项目，禁用签名
          xcodebuild -project AirBeep.xcodeproj -scheme AirBeep -sdk iphoneos -configuration Release -derivedDataPath ./build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          
          # 创建 IPA 包结构
          mkdir -p Payload
          # 将编译出的 .app 移动进 Payload
          mv build/Build/Products/Release-iphoneos/*.app Payload/
          # 压缩成 zip 并改名为 ipa
          zip -r AirBeep-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirBeep-IPA
          path: AirBeep-unsigned.ipa
